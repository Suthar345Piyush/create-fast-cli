version: 2

project_name: create-fast-cli 

before:
  hooks:
    - go mod tidy
    - go mod verify
    - go vet ./...


builds:
  - id: create-fast-cli
    main: ./main.go
    binary: create-fast-cli
    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64 

    ignore:
      - goos: windows
        goarch: arm64

    ldflags:
      
      - -s -w
      - -X github.com/create-fast-cli/create-fast-cli/cmd.version={{.Version}}
      - -X github.com/create-fast-cli/create-fast-cli/cmd.commit={{.Commit}}
      - -X github.com/create-fast-cli/create-fast-cli/cmd.date={{.Date}}

    mod_timestamp: "{{ .CommitTimestamp}}"



archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

    format_overrides:
      - goos: windows
        format: zip 

    files:
      - README.md
      - LICENSE 



checksum:
  name_template: checksum.txt
  algorithm: sha256



changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request 
      - Merge branch 


  groups:
    - title: "Features"
      regexp: "^feat"
      order: 0

    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1

    - title: "Performance"
      regexp: "^perf"
      order: 2

    - title: "Security"
      regexp: "^sec"
      order: 3

    - title: Other
      order: 999 


release:
  github:
    owner: create-fast-cli
    name: create-fast-cli

  name_template: "v{{.Version}}"
  draft: false 
  prerelease: auto 


  




   
