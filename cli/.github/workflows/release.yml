name: goreleaser

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"   # triggers on v1.2.3 ....

permissions:
  contents: write


jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for goreleaser changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      
      - name: Fetch all tags 
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

       
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest 
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       
